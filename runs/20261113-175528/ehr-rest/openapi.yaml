openapi: 3.0.3
info:
  title: 'MediCore EHR (REST API): FHIR facade'
  version: 0.1.0
  description: 'Integration pattern: api_facade. MediCore EHR provides a structured REST API over HTTP with JSON
    endpoints for patients and conditions. Wrapping it with an API facade translates records on demand without duplicating
    data storage.'
paths:
  /fhir/Patient:
    get:
      summary: Patient resources sourced from MediCore EHR (REST API)
      parameters:
      - name: mrn
        in: query
        required: false
        schema:
          type: string
        description: Return only resources for the patient with this MRN.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one source system, e.g. ehr-rest.
      responses:
        '200':
          description: FHIR R4 searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
      x-source-entity: Patient
      x-merge-rule: none
      x-field-map:
      - fhir: id
        source: patientId
        transform: 'Prefix with system identifier: ''ehr-rest-'' + patientId'
      - fhir: meta.source
        source: patientId
        transform: Set constant string 'urn:system:ehr-rest'
      - fhir: active
        source: active
        transform: Pass-through boolean value
      - fhir: identifier[0]
        source: mrn
        transform: 'Construct identifier object: {''system'': ''http://hospital.example.org/mrn'', ''value'': mrn}'
      - fhir: name[0].family
        source: name.last
        transform: Direct string assignment
      - fhir: name[0].given[0]
        source: name.first
        transform: Wrap string in list as given name
      - fhir: gender
        source: sex
        transform: 'Code mapping: ''M'' -> ''male'', ''F'' -> ''female'', default to ''unknown'''
      - fhir: birthDate
        source: dob
        transform: Convert date format from MM/DD/YYYY to YYYY-MM-DD
      - fhir: telecom[0]
        source: contact.phone
        transform: 'Map non-empty phone to object: {''system'': ''phone'', ''value'': contact.phone}. Omit empty
          contact.email.'
      - fhir: address[0].line[0]
        source: address.line1
        transform: Wrap line1 in array if present
      - fhir: address[0].city
        source: address.city
        transform: Direct string assignment
      - fhir: address[0].postalCode
        source: address.postCode
        transform: Direct string assignment
      - fhir: address[0].country
        source: address.country
        transform: Direct string assignment
  /fhir/Condition:
    get:
      summary: Condition resources sourced from MediCore EHR (REST API)
      parameters:
      - name: mrn
        in: query
        required: false
        schema:
          type: string
        description: Return only resources for the patient with this MRN.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one source system, e.g. ehr-rest.
      responses:
        '200':
          description: FHIR R4 searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
      x-source-entity: Condition
      x-merge-rule: none
      x-field-map:
      - fhir: id
        source: conditionId
        transform: 'Prefix with system identifier: ''ehr-rest-'' + conditionId'
      - fhir: meta.source
        source: conditionId
        transform: Set constant string 'urn:system:ehr-rest'
      - fhir: clinicalStatus
        source: state
        transform: 'Map ''A'' -> {''coding'': [{''system'': ''http://terminology.hl7.org/CodeSystem/condition-clinical'',
          ''code'': ''active''}]}, ''R'' -> {''coding'': [{''system'': ''http://terminology.hl7.org/CodeSystem/condition-clinical'',
          ''code'': ''resolved''}]}'
      - fhir: code
        source: code.value
        transform: 'Construct CodeableConcept using SNOMED URI: {''coding'': [{''system'': ''http://snomed.info/sct'',
          ''code'': code.value, ''display'': code.text}]}'
      - fhir: subject
        source: mrn
        transform: 'Construct logical patient reference: {''identifier'': {''system'': ''http://hospital.example.org/mrn'',
          ''value'': mrn}}'
      - fhir: onsetDateTime
        source: onsetDate
        transform: Direct string mapping (already YYYY-MM-DD standard date)
components:
  schemas:
    Bundle:
      type: object
      description: FHIR R4 Bundle (type searchset)
      externalDocs:
        url: https://hl7.org/fhir/R4/bundle.html
      properties:
        resourceType:
          type: string
          enum:
          - Bundle
        type:
          type: string
          enum:
          - searchset
        total:
          type: integer
        entry:
          type: array
          items:
            type: object
