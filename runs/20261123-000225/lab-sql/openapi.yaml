openapi: 3.0.3
info:
  title: 'LabTrak LIS (legacy SQL database): FHIR facade'
  version: 0.1.0
  description: 'Integration pattern: database_polling. LabTrak LIS is a legacy SQLite database with direct read-only
    SQL file access. It lacks an API or event messaging stream, making scheduled SQL polling the only suitable mechanism.'
paths:
  /fhir/Patient:
    get:
      summary: Patient resources sourced from LabTrak LIS (legacy SQL database)
      parameters:
      - name: mrn
        in: query
        required: false
        schema:
          type: string
        description: Return only resources for the patient with this MRN.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one source system, e.g. lab-sql.
      responses:
        '200':
          description: FHIR R4 searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
      x-source-entity: PT_MSTR
      x-merge-rule: none
      x-field-map:
      - fhir: id
        source: PT_MSTR.PT_ID
        transform: 'Prefix with system identifier: ''lab-sql-'' + PT_ID'
      - fhir: meta.source
        source: static
        transform: Set constant 'urn:system:lab-sql'
      - fhir: identifier[0]
        source: PT_MSTR.MRN_NO
        transform: Build Identifier object with system 'http://hospital.example.org/mrn' and value set to MRN_NO
          string
      - fhir: name[0].family
        source: PT_MSTR.LNAME
        transform: Direct string map; omit if null or empty
      - fhir: name[0].given[0]
        source: PT_MSTR.FNAME
        transform: Wrap non-empty string in single-element array; omit if null or empty
      - fhir: gender
        source: PT_MSTR.SEX_CD
        transform: 'Code mapping: ''M'' -> ''male'', ''F'' -> ''female''; otherwise ''unknown'''
      - fhir: birthDate
        source: PT_MSTR.DOB_DT
        transform: Format YYYYMMDD integer/text into date string 'YYYY-MM-DD'
  /fhir/Observation:
    get:
      summary: Observation resources sourced from LabTrak LIS (legacy SQL database)
      parameters:
      - name: mrn
        in: query
        required: false
        schema:
          type: string
        description: Return only resources for the patient with this MRN.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one source system, e.g. lab-sql.
      responses:
        '200':
          description: FHIR R4 searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
      x-source-entity: LAB_RSLT
      x-merge-rule: none
      x-field-map:
      - fhir: id
        source: LAB_RSLT.RSLT_ID
        transform: 'Prefix with system identifier: ''lab-sql-'' + RSLT_ID'
      - fhir: meta.source
        source: static
        transform: Set constant 'urn:system:lab-sql'
      - fhir: status
        source: LAB_RSLT.RSLT_STAT
        transform: 'Code mapping: ''F'' -> ''final'', ''P'' -> ''preliminary'', ''C'' -> ''corrected''; default
          to ''registered'' if unmapped or missing'
      - fhir: category[0]
        source: static
        transform: Set coding array containing system 'http://terminology.hl7.org/CodeSystem/observation-category'
          and code 'laboratory'
      - fhir: code.coding[0]
        source: TEST_REF.LOINC_CD, TEST_REF.TEST_NM
        transform: Join LAB_RSLT to TEST_REF on TEST_CD. Map system 'http://loinc.org', code LOINC_CD, display TEST_NM
      - fhir: subject
        source: PT_MSTR.MRN_NO
        transform: Join LAB_RSLT to PT_MSTR on PT_ID. Set logical reference identifier system 'http://hospital.example.org/mrn'
          and value MRN_NO
      - fhir: effectiveDateTime
        source: LAB_RSLT.COLL_DTTM
        transform: Parse timestamp string YYYYMMDDHHMMSS and convert to ISO-8601 UTC string 'YYYY-MM-DDThh:mm:ssZ'
      - fhir: valueQuantity
        source: LAB_RSLT.RSLT_VAL, TEST_REF.UOM
        transform: Parse RSLT_VAL as numeric float for value. Map UOM to unit and code, with system 'http://unitsofmeasure.org'.
          Omit if RSLT_VAL is non-numeric string.
      - fhir: interpretation[0].coding[0]
        source: LAB_RSLT.ABN_FLG
        transform: 'Code mapping: ''H'' -> ''H'', ''L'' -> ''L'', ''N'' -> ''N'' with system ''http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation'';
          omit if empty or unmapped'
components:
  schemas:
    Bundle:
      type: object
      description: FHIR R4 Bundle (type searchset)
      externalDocs:
        url: https://hl7.org/fhir/R4/bundle.html
      properties:
        resourceType:
          type: string
          enum:
          - Bundle
        type:
          type: string
          enum:
          - searchset
        total:
          type: integer
        entry:
          type: array
          items:
            type: object
